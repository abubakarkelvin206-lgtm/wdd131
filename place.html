<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">

    <meta name="description" content="Learn about Nigeria, its people, culture, weather, and beautiful places.">
    <meta name="author" content="Abubakar Kelvin">

    <header>
        <h1>Nigeria</h1>

    <main>

                <source media="(min-width: 700px)" srcset="images/Nigeria4.webp">

           <section class="country-info">
             <h2>Data</h2>

              <img src="images/weather-2.svg" alt="Weather icon">

              <p><strong>Wind:</strong> 10 km/h</p>

        </section>
            
        
    </main>

    <footer>
        <p>
            &copy; <span id="currentyear"></span> Abubakar Kelvin, Nigeria
        </p>
